[project]
name = "nidol"
version = "0.1.0"
description = "bye0 matching service: any music link or query → canonical track + playable YouTube candidates"
readme = "README.md"
license = "WTFPL"
authors = [
    { name = "Gonzalo Alarcon", email = "gonzaloalarcon@ug.uchile.cl" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
nidol = "nidol:main"
# Dev tools (need the dev group's pyyaml): see src/nidol/accuracy.py
label = "nidol.accuracy:label_main"
accuracy = "nidol.accuracy:accuracy_main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
